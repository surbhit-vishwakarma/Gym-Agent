apiVersion: v1
kind: Service
metadata:
  name: gym-agent
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: gym-agent
---
apiVersion: v1
kind: Service
metadata:
  name: gym-agent-lb
  namespace: default
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: gym-agent

